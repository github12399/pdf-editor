appId: com.zcode.pdf-editor
productName: PDF文字编辑器
copyright: PDF 文字编辑器

directories:
  output: release
  buildResources: build

# 复用本地已解压的 electron 发行版：绕开下载 zip 的解压+rename 环节
# （该环节在杀软实时扫描下常报 EPERM）
# 注意：此配置仅用于 Windows 本地打包，通过 package.json 的 app:build 脚本
# 以 -c.electronDist=... 传入；mac/linux 及 CI 走默认下载（支持多架构）。

# 只打包运行所需内容；node_modules 由 builder 按 dependencies 自动裁剪 devDependencies
files:
  - dist/**/*
  - electron/**/*
  - package.json

asar: true
compression: maximum

# 发布由 GitHub Actions 的独立步骤完成（softprops/action-gh-release），
# 不用 electron-builder 内置发布：显式关闭，否则它会因缺 GH_TOKEN 报错
publish: null

win:
  # portable：单文件免安装，拷走即用；nsis：常规安装包
  # 产物名用英文：GitHub Release 资产名会剥掉中文（PDF文字编辑器 → PDF.）
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: PDF-Editor-Setup-${version}.exe

portable:
  artifactName: PDF-Editor-Portable-${version}.exe

# macOS：未签名分发（无 Apple 开发者账号），首次打开需右键 → 打开
# 一个 mac 构建机即可交叉产出两种芯片的 dmg（arm64 = Apple 芯片，x64 = Intel 芯片）
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  artifactName: PDF-Editor-mac-${arch}-${version}.dmg
  identity: null

# Linux：AppImage 免安装（chmod +x 直接跑），deb 给 Ubuntu/Debian 用户
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  artifactName: PDF-Editor-linux-${version}.${ext}
  maintainer: zcode
  # 窗口与 .desktop 关联（WM_CLASS），需与 package.json 的 desktopName 一并设置
  syncDesktopName: true
